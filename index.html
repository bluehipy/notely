<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notely - Your Personal Note-Taking App</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">

  <!-- Gridstack -->
  <link rel="stylesheet" href="./node_modules/gridstack/dist/gridstack.min.css">
  <script src="./node_modules/gridstack/dist/gridstack-all.js"></script>

  <!-- Lucide Icons -->
  <script src="./js/lucide.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header Bar -->
    <header class="header">
      <!-- Theme Toggle -->
      <button class="theme-toggle" title="Toggle theme">
        <i data-lucide="sun"></i>
      </button>

      <!-- Search Input -->
      <div class="search-input-wrapper">
        <i class="search-input-icon" data-lucide="search"></i>
        <input
          type="text"
          class="search-input"
          placeholder="Search notes..."
        />
      </div>

      <!-- Dashboard contextual slot (replaces search when on dashboard) -->
      <div id="header-contextual" hidden></div>
    </header>

    <!-- Main Content (Three Panels) -->
    <main class="main">
      <!-- Sidebar (Left Panel) -->
      <aside class="sidebar" id="sidebar">
        <!-- Rendered by render.js -->
      </aside>

      <!-- Note List (Middle Panel) -->
      <section class="note-list" id="note-list">
        <!-- Rendered by render.js -->
      </section>

      <!-- Editor (Right Panel) -->
      <section class="editor" id="editor">
        <!-- Rendered by render.js -->
      </section>

      <!-- Dashboard (replaces note-list + editor when active) -->
      <section class="dashboard" id="dashboard" hidden>
        <!-- Rendered by render.js -->
      </section>

      <!-- Tasks View -->
      <section class="feature-view" id="tasks-view" hidden></section>

      <!-- Calendar View -->
      <section class="feature-view" id="calendar-view" hidden></section>

      <!-- Settings View -->
      <section class="feature-view" id="settings-view" hidden></section>

      <!-- AI Advisor View -->
      <section class="feature-view" id="advisor-view" hidden></section>
    </main>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="./js/app.js"></script>

  <!-- Dialog Container -->
  <div id="dialog-container"></div>

  <!-- Toast Container -->
  <div id="toast-container" style="position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: var(--space-sm);"></div>
</body>
</html>
